<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Area amministratore privata di TechReview.">
  <title>Amministrazione | TechReview</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fb; color: #172033; }
    header { background: white; border-bottom: 1px solid #e5e9f0; padding: 18px 5%; display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .logo { font-size: 22px; font-weight: 750; color:#172033; text-decoration:none; }
    .logo span { color:#2878f0; }
    main { max-width: 920px; margin: 42px auto; padding: 0 18px; }
    .panel { background:white; border:1px solid #e5e9f0; border-radius:16px; padding:26px; box-shadow:0 8px 28px rgba(20,35,60,.05); }
    h1 { margin:0 0 8px; font-size:28px; }
    .muted { color:#687386; line-height:1.5; }
    form { display:grid; gap:13px; max-width:440px; margin-top:22px; }
    input { width:100%; padding:13px 14px; border:1px solid #d8deea; border-radius:9px; font:inherit; }
    button { border:0; border-radius:9px; padding:11px 16px; background:#2878f0; color:white; font:inherit; font-weight:650; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    button.secondary { background:#edf2f8; color:#243047; }
    button.danger { background:#c93434; }
    .topline { display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
    .review { border:1px solid #e5e9f0; border-radius:12px; padding:18px; margin:14px 0; }
    .review h3 { margin:0 0 7px; }
    .review p { white-space:pre-wrap; line-height:1.5; }
    .meta { color:#687386; font-size:13px; }
    .actions { display:flex; gap:9px; flex-wrap:wrap; }
    .status { min-height:22px; margin:8px 0 0; color:#526176; }
    .hidden { display:none !important; }
    @media(max-width:600px) { main { margin:24px auto; } .panel { padding:19px; } h1 { font-size:24px; } }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">TechReview<span>.</span></a>
    <a href="index.html" class="muted">Torna al sito</a>
  </header>
  <main>
    <section id="loginPanel" class="panel">
      <h1>Area amministratore</h1>
      <p class="muted">Accedi con l'email e la password del tuo account amministratore.</p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="La tua email" autocomplete="username" required>
        <input id="password" type="password" placeholder="La tua password" autocomplete="current-password" required>
        <button id="loginButton" type="submit">Accedi</button>
      </form>
      <p id="loginStatus" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="adminPanel" class="panel hidden">
      <div class="topline">
        <div>
          <h1>Gestione recensioni</h1>
          <p class="muted">Le recensioni in attesa sono visibili soltanto a te.</p>
        </div>
        <button id="logoutButton" class="secondary" type="button">Esci</button>
      </div>
      <p id="adminStatus" class="status" role="status" aria-live="polite"></p>
      <div id="reviewList"></div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
